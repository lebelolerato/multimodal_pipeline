version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: multimodal_app
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
    tty: true
    stdin_open: true
    environment:
      - PYTHONUNBUFFERED=1
    # uncomment the following if you want to expose Jupyter
    # ports:
    #   - "8888:8888"
